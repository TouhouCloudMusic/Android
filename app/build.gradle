plugins {
    alias(libs.plugins.androidApplication)
}

android {
    namespace 'net.hearnsoft.tcm'
    compileSdk 34

    defaultConfig {
        applicationId "net.hearnsoft.tcm"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        def serverPropsFile = rootProject.file('server.properties')
        if (serverPropsFile.exists()) {
            def serverProps = new Properties()
            serverProps.load(new FileInputStream(serverPropsFile))
            buildConfigField "String", "REMOTE_SERVER", "\"${serverProps['REMOTE_SERVER']}\""
        } else {
            throw new GradleException("server.properties file not found")
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        //启用 ViewBinding
        viewBinding = true
        //启用 BuildConfig
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    // BannerViewPager
    implementation libs.bannerviewpager
    // Glide
    implementation libs.glide
    // Glide Transformations
    implementation libs.glide.transformations
    // OkHttp
    implementation libs.okhttp
    // Gson
    implementation libs.gson
    // uCrop
    implementation libs.ucrop
    // MPAndroidChart
    implementation libs.mpandroidchart
    // Lombok
    implementation libs.lombok
    // AndroidX Navigation
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    testImplementation libs.junit
    // Lombok annotation processor
    annotationProcessor libs.lombok
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}